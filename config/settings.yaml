# XBot settings. Everything here can be changed without touching code.

handle: 0xYYcn
timezone: America/New_York        # used for posting windows / daily caps
language: en                      # en | zh | bilingual  (the profiler will suggest one)

# draft   = generate drafts only (see `xbot drafts`), never post
# approve = drafts go to your Telegram / CLI inbox; only approved drafts are posted  (RECOMMENDED)
# auto    = drafts that pass the critic with a high score are posted automatically
#           (replies to other people's posts ALWAYS need approval, whatever the mode)
mode: approve

# Per-agent model + effort. Opus 5.5 everywhere by default; switch scout/curator to
# claude-sonnet-5-5 or claude-haiku-5-5 to cut cost if quality holds for you.
models:
  scout:    {model: claude-opus-5-5, effort: medium, max_tokens: 16000}
  curator:  {model: claude-opus-5-5, effort: medium, max_tokens: 16000}
  writer:   {model: claude-opus-5-5, effort: high,   max_tokens: 16000}
  critic:   {model: claude-opus-5-5, effort: medium, max_tokens: 16000}
  replier:  {model: claude-opus-5-5, effort: high,   max_tokens: 16000}
  profiler: {model: claude-opus-5-5, effort: high,   max_tokens: 16000}
use_fallbacks: true               # server-side refusal fallback (Claude API)

# How often each stage runs when you call `xbot tick` (minutes).
cadence:
  collect: 180        # pull RSS / DefiLlama / GitHub / CoinGecko / X watch-list, then curate + write
  scout: 480          # Claude web-search scout (costs more; finds what feeds miss)
  metrics: 720        # pull engagement metrics on your posts (needs X read access)

pipeline:
  item_max_age_hours: 48
  max_items_to_curator: 60
  picks_per_run: 3          # max new drafts per collect cycle
  min_score: 65             # curator score (0-100) needed to draft
  variants_per_pick: 2      # writer produces N variants, critic picks the best
  auto_post_min_score: 80   # critic score needed to auto-post in `auto` mode

posting:
  max_posts_per_day: 6
  min_minutes_between_posts: 75
  windows: ["08:00-11:30", "12:00-15:00", "18:30-23:00"]   # local time
  max_post_chars: 280       # set to 25000 if you have X Premium and want long posts
  link_strategy: reply      # inline | reply (source link goes in a self-reply; X ranks link-posts lower) | none
  allow_threads: true
  max_thread_len: 5

replies:
  enabled: true             # draft quote-posts / replies for posts from your watch list
  max_per_run: 2

compliance:
  # Projects you work for, advise, invested in, or hold a material position in.
  # The critic will add a disclosure or block the post.
  affiliations: []
  avoid_tokens: []          # tickers/projects never to mention
  banned_phrases:
    - "not financial advice"
    - "NFA"
    - "to the moon"
    - "100x"
    - "guaranteed"
    - "don't miss"
    - "game-changer"
    - "game changer"
    - "revolutionary"
    - "LFG"
    - "WAGMI"
    - "🚀"
  max_hashtags: 1
  max_emojis: 1

telegram:
  enabled: true
